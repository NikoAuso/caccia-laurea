<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Buste della caccia — GR-2026</title>
<style>
  @page{size:A4; margin:0}
  :root{
    --ink:#10222B;
    --muted:#5E727C;
    --uv:#5B3FD1;
    --sans: system-ui, "Ubuntu Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "DejaVu Sans Mono", "Ubuntu Mono", monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans); color:var(--ink); -webkit-print-color-adjust:exact; print-color-adjust:exact}

  .sheet{
    /* foglio A4 verticale: il contenuto sta nella metà alta, la metà bassa resta
       bianca. Piegato a metà, davanti c'è la scritta e dietro il bianco. */
    width:210mm; height:297mm; padding:10mm 10mm calc(148.5mm + 10mm); overflow:hidden;
    display:flex; flex-direction:column; gap:6mm;
    break-after:page;
  }
  .sheet:last-child{break-after:auto}

  header{
    display:flex; justify-content:space-between; align-items:flex-end;
    font-size:8pt; letter-spacing:.06em; line-height:1.45; color:var(--muted);
    border-bottom:.5mm solid var(--ink); padding-bottom:1.6mm;
  }
  header .r{text-align:right}
  header b{display:block; color:var(--ink); font-weight:600}

  .word{flex:1; min-height:0}
  .word svg{display:block; width:100%; height:100%; fill:var(--ink)}

  .steps{text-align:center}
  .steps h2{margin:0 0 2mm; font-size:7.5pt; font-weight:600; letter-spacing:.12em; color:var(--uv)}
  .steps p{margin:0; font-family:var(--mono); font-size:12pt; font-weight:700; line-height:1.45}
</style>
</head>
<body>

<script>
/* ===========================================================
   LE BUSTE

   Una voce per busta. Si stampa una busta per foglio A4 verticale
   (al 100%), con tutto nella metà alta; poi si piega a metà: la chiave occupa tutta la larghezza, sotto ci
   sono i comandi da scrivere al terminale.

     word    la chiave: identica a KEY6 / KEY7 in build.sh
     step    la sezione che quella chiave apre

   Aperta senza niente in coda all'indirizzo, la pagina mostra
   tutte le buste (una per pagina). Con "#1" o "#2" in
   coda ne mostra una sola. Per farne un PDF:

     google-chrome --headless --no-pdf-header-footer \
       --virtual-time-budget=3000 \
       --print-to-pdf=busta-2.pdf "file://$PWD/buste.html#2"
   =========================================================== */

var BUSTE = {
  "1": { word:"PASSWORD-5", step:6 },
  "2": { word:"PASSWORD-6", step:7 }
};

/* =========================================================== */

var FONT = '700 100px "Nimbus Sans Narrow", "Liberation Sans Narrow", "Arial Narrow", sans-serif';
var SVGNS = 'http://www.w3.org/2000/svg';

function sheet(b){
  var el = document.createElement('section');
  el.className = 'sheet';
  el.innerHTML =
    '<header><div>Università degli Studi<b>Laurea magistrale in Bioinformatica</b></div>' +
    '<div class="r">Pratica GR-2026 · 15 luglio 2026' +
    '<b>CHIAVE D\'ACCESSO · SEZIONE ' + String(b.step).padStart(2, '0') + ' DI 09</b></div></header>' +
    '<div class="word"></div>' +
    '<div class="steps"><h2>TORNA AL TERMINALE E SCRIVI, UNA RIGA ALLA VOLTA</h2>' +
    '<p>unzip step' + b.step + '.zip</p>' +
    '<p>cd step' + b.step + '</p>' +
    '<p>cat README.txt</p></div>';
  document.body.appendChild(el);
  el.querySelector('.word').appendChild(word(b.word));
}

// la chiave come SVG col viewBox stretto sulle lettere: si allarga fino a
// toccare i bordi del riquadro senza deformarsi, centrata in verticale
function word(text){
  var m = document.createElement('canvas').getContext('2d');
  m.font = FONT;
  var t = m.measureText(text);
  var x = -t.actualBoundingBoxLeft, w = t.actualBoundingBoxLeft + t.actualBoundingBoxRight;
  var y = -t.actualBoundingBoxAscent, h = t.actualBoundingBoxAscent + t.actualBoundingBoxDescent;

  var svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('viewBox', x + ' ' + y + ' ' + w + ' ' + h);
  var tx = document.createElementNS(SVGNS, 'text');
  tx.setAttribute('x', 0);
  tx.setAttribute('y', 0);
  tx.style.font = FONT;
  tx.textContent = text;
  svg.appendChild(tx);
  return svg;
}

document.fonts.load(FONT).then(function(){
  var one = BUSTE[location.hash.slice(1)];
  (one ? [one] : Object.keys(BUSTE).map(function(k){ return BUSTE[k]; })).forEach(sheet);
});
</script>
</body>
</html>
